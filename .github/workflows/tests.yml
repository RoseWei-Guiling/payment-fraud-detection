name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal dependencies
        run: pip install numpy pandas pyarrow tabulate pytest duckdb scikit-learn lightgbm fastapi httpx
      - name: Run tests on fake data
        run: pytest -q
